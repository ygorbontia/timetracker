const SESSION_KEY = 'timetracker_session_v1', WIPE_KEY = 'timetracker_wipe_v1';
// Limpeza única: remove contas, metas, rotinas e registros que já estivessem salvos neste aparelho.
(() => {
  try {
    if (localStorage.getItem(WIPE_KEY)) return;
    const del = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && (k === AUTH_KEY || k.startsWith(LS))) del.push(k); }
    del.forEach(k => localStorage.removeItem(k));
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
    localStorage.setItem(WIPE_KEY, '1');

})();

  if (j.user && j.user.id) cloud.uid = j.user.id;
  { const mn = j.user && j.user.user_metadata && j.user.user_metadata.name, u = curUser && auth.users[curUser]; // nome alterado em outro aparelho
    if (mn && u && cleanName(mn) !== u.nome) { u.nome = cleanName(mn); authSave(); if (document.querySelector('.auth .who strong')) accountModal(); } }
  if (cloud.meta) { cloud.meta.refresh = j.refresh_token; if (cloud.uid) cloud.meta.uid = cloud.uid; metaSave(); }
}
function cloudApply(rows) { // aplica o que veio da nuvem (a mais recente de cada registro vence)
  const m = cloud.meta, touched = new Set(); let any = false;
  const idx = { goals: new Map(), tasks: new Map(), routines: new Map() };
  for (const r of rows) {
    if (!isRec(r) || typeof r.k !== 'string' || !okNum(r.ts, 0, 1e16)) continue;
    const k = r.k, ls = m.dead[k] || m.stamp[k] || 0;
    if (r.ts > (m.hi || 0) && r.ts < Date.now() + 6048e5) m.hi = r.ts;
    if (k === 'meta/timer') { const rv = isRec(r.v) && Number.isInteger(r.v.ver) && r.v.ver >= 0 ? r.v.ver : 0, lv = m.tver || 0; if (!(rv > lv || (rv === lv && r.ts > ls))) continue; } // cronômetro: vence a maior versão
    else if (r.ts <= ls) continue; // o local é mais novo (ou igual): mantém
    const cut = k.indexOf('/'), top = cut > 0 ? k.slice(0, cut) : '', id = k.slice(cut + 1);
    // só chaves e conteúdos no formato esperado entram; o resto é ignorado (a nuvem nunca é confiável cegamente)
    if (!((top === 'meta' && id === 'timer') || ((top === 'sessions' || top === 'rdays') && okDate(id)) || (SAN[top] && !['sessions', 'rdays'].includes(top) && ID_RE.test(id)))) continue;
    let val = null, pos = null;
    if (!r.dead) {
      if (top === 'meta') val = sanTimer(r.v);
      else if (top === 'sessions' || top === 'rdays') val = SAN[top](r.v);
      else if (isRec(r.v)) { const raw = { ...r.v }; pos = raw._i; delete raw._i; val = SAN[top](raw); if (val && val.id !== id) val = null; }
      if (!val) continue;
    }
    any = true;
    if (top === 'sessions' || top === 'rdays') {
      if (r.dead) delete S[top][id]; else S[top][id] = val;
    } else if (top === 'meta') {
      if (!r.dead) { S.timer = val; m.tver = val.ver || 0; m.tsig = JSON.stringify([val.running, val.startTs, val.acc, val.days]); }
    } else {
      const a = S[top], i = a.findIndex(x => String(x.id) === id);
      if (r.dead) { if (i >= 0) a.splice(i, 1); }
      else { if (Number.isInteger(pos)) idx[top].set(id, pos); if (i >= 0) a[i] = val; else a.push(val); touched.add(top); }
    }
    if (r.dead) { m.dead[k] = r.ts; delete m.stamp[k]; delete m.snap[k]; }
    else { m.stamp[k] = r.ts; delete m.dead[k]; m.snap[k] = recStr(k, val); }
    delete m.dirty[k];
  }
  for (const top of touched) {
    const a = S[top], cur = new Map(a.map((x, i) => [String(x.id), i]));
    a.sort((x, y) => { const ix = idx[top].has(String(x.id)) ? idx[top].get(String(x.id)) : cur.get(String(x.id)), iy = idx[top].has(String(y.id)) ? idx[top].get(String(y.id)) : cur.get(String(y.id)); return ix - iy || cur.get(String(x.id)) - cur.get(String(y.id)); });
  }
  if (touched.has('tasks')) S.tasks = normTasks(S.tasks);
  return any;
}
async function cloudSync() {
  if (!cloud.on || !cloud.meta) return;
  if (cloud.busy) { cloud.again = true; return; }
  if (!navigator.onLine) { cloudSetStatus('offline'); return; }
  cloud.busy = true;
  try {
    const token = await cloudToken(), m = cloud.meta, uid = cloud.uid || m.uid;
    // 1) baixar
    let changed = false;
    for (let n = 0; n < 50; n++) {
      const r = await cloudFetch('/rest/v1/records?select=k,v,ts,dead,srv&srv=gt.' + m.since + '&order=srv.asc&limit=500', {}, token);
      if (r.status === 401) { cloud.tok = null; throw new Error('baixar: 401 ' + (await cloudErr(r)).slice(0, 90)); }
      if (!r.ok) throw new Error('baixar: HTTP ' + r.status + ' ' + (await cloudErr(r)).slice(0, 90));
      const rows = await r.json();
      if (!rows.length) break;
      cloud.applying = true; try { if (cloudApply(rows)) changed = true; } finally { cloud.applying = false; }
      m.since = rows[rows.length - 1].srv;
      if (rows.length < 500) break;
    }
    if (changed) { try { localStorage.setItem(dataKey(), JSON.stringify(S)); } catch (e) {} cloudRefreshUI(); }
    cloudDiff(); // (renumeração etc. feita ao aplicar)
    // 2) enviar
    const keys = Object.keys(m.dirty);
    if (keys.length) {
      const recs = cloudRecs(), sent = {};
      const body = keys.map(k => { const dead = !(k in recs); sent[k] = dead ? m.dead[k] : m.stamp[k]; return { user_id: uid, k, v: dead ? null : recs[k], ts: sent[k], dead }; });
      for (let i = 0; i < body.length; i += 200) {
        const r = await cloudFetch('/rest/v1/records?on_conflict=user_id,k', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(body.slice(i, i + 200)) }, token);
        if (r.status === 401) { cloud.tok = null; throw new Error('enviar: 401 ' + (await cloudErr(r)).slice(0, 90)); }
        if (!r.ok) throw new Error('enviar: HTTP ' + r.status + ' ' + (await cloudErr(r)).slice(0, 90));
      }
      for (const k of keys) if ((m.dead[k] || m.stamp[k]) === sent[k]) delete m.dirty[k];
    }
    m.fresh = false; metaSave(); cloud.last = Date.now();
    cloudSetStatus(Object.keys(m.dirty).length ? 'pend' : 'ok');
  } catch (e) {
    cloud.errMsg = e && e.message || '';
    if (e && e.auth) cloudSetStatus('auth');
    else if (!navigator.onLine || (e && (e.name === 'TypeError' || e.name === 'AbortError'))) cloudSetStatus('offline');
    else cloudSetStatus('err');
  } finally {
    cloud.busy = false;
    if (cloud.again) { cloud.again = false; setTimeout(cloudSync, 300); }
  }
}
function cloudRefreshUI() { // redesenha sem atrapalhar quem está digitando
  if ($('#modal').innerHTML || $('#gate').innerHTML) return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest('#view')) { cloud.dirtyUI = true; return; }
  cloud.dirtyUI = false; render();
}
function cloudStart() {
  cloudStop();
  if (!CLOUD || !curUser) return;
  cloud.on = true; cloud.meta = metaLoad(curUser); cloud.uid = cloud.meta.uid || null;
  if (!skSet && Number.isFinite(cloud.meta.skew)) SK = cloud.meta.skew;
  if (cloud.pending) { cloudTok(cloud.pending); cloud.pending = null; }
  if (cloud.meta.fresh && !Object.keys(cloud.meta.snap).length) { /* primeiro uso neste aparelho: o que já existe localmente é enviado */ }
  cloudDiff(); metaSave();
  cloud.status = ''; cloudSetStatus(navigator.onLine ? 'pend' : 'offline');
  cloudSync();
  cloud.poll = setInterval(() => { if (document.visibilityState === 'visible') { cloudSync(); if (cloud.dirtyUI) cloudRefreshUI(); } }, 8000);
}
function cloudStop() { cloud.on = false; clearInterval(cloud.poll); clearTimeout(cloud.timer); cloud.meta = null; cloud.tok = null; cloud.status = 'off'; }
if (typeof window !== 'undefined') {
  addEventListener('online', () => { if (cloud.on) cloudSync(); });
  addEventListener('offline', () => { if (cloud.on) cloudSetStatus('offline'); });
  document.addEventListener('visibilitychange', () => { if (cloud.on && document.visibilityState === 'visible') cloudSync(); });
  addEventListener('focus', () => { if (cloud.on) cloudSync(); });
  addEventListener('pageshow', () => { if (cloud.on) cloudSync(); });
}
// ---- conta na nuvem ----
const cloudErr = async r => { let j = {}; try { j = await r.json(); } catch (e) {} return (j.msg || j.error_description || j.message || j.error || '').toString(); };
function cloudMsg(m) {
  m = (m || '').toLowerCase();
  if (m.includes('already')) return 'Esse usuário já existe. Escolha outro.';
  if (m.includes('email') && m.includes('invalid') && !m.includes('login')) return 'O servidor recusou o formato do usuário. Tente outro nome de usuário.';
  if (m.includes('invalid login') || m.includes('invalid_grant') || m.includes('invalid credentials')) return 'Usuário ou senha incorretos.';
  if (m.includes('not confirmed')) return 'O servidor está exigindo confirmação de e-mail. Desligue "Confirm email" no Supabase (Authentication → Sign In / Providers → Email).';
  if (m.includes('signups not allowed') || m.includes('signup is disabled')) return 'Criação de contas está desativada.';
  if (m.includes('rate') || m.includes('too many')) return 'Muitas tentativas. Aguarde um pouco.';
  if (m.includes('password')) return 'Senha recusada pelo servidor (mínimo de 6 caracteres).';
  return m ? 'Não foi possível concluir (' + m.slice(0, 120) + ').' : 'Não foi possível concluir. Tente de novo.';
}
async function cloudLogin(email, pass) { // devolve {ok} | {offline:true} | {error}
  if (!navigator.onLine) return { offline: true };
  try {
    const r = await cloudFetch('/auth/v1/token?grant_type=password', { method: 'POST', body: JSON.stringify({ email, password: pass }) });
    if (!r.ok) return { error: cloudMsg(await cloudErr(r)) };
    return { ok: true, j: await r.json() };
  } catch (e) { return { offline: true }; }
}
async function cloudSignup(email, pass, nome) {
  try {
    const r = await cloudFetch('/auth/v1/signup', { method: 'POST', body: JSON.stringify({ email, password: pass, data: { name: nome } }) });
    if (!r.ok) return { error: cloudMsg(await cloudErr(r)) };
    const j = await r.json();
    if (j && j.user && Array.isArray(j.user.identities) && !j.user.identities.length) return { error: 'Esse usuário já existe. Escolha outro.' };
    return { ok: true };
  } catch (e) { return { error: 'Sem conexão com a internet. Criar conta exige internet.' }; }
}

// No programa local, fechar a janela pausa o cronômetro para não contar o tempo em que o programa ficou fechado.
// ---- miniaturas do cronômetro ----
// miniatura do programa do Windows: manda o estado do cronômetro para a janelinha
let miniLast = { run: null, t: 0, v: 0 };
function miniPush() {
  if (!(window.ttStore && window.ttStore.mini) || !curUser || !auth.session) return;
  const run = !!S.timer.running, v = Math.round(info(today()).raw * 1000 + elapsed()), now = Date.now();
  if (run === miniLast.run && now - miniLast.t < 4000 && (run || Math.abs(v - miniLast.v) < 1000)) return;
  miniLast = { run, t: now, v }; try { window.ttStore.mini({ run, ms: v }); } catch (e) {}
}
// ---- aviso "cronômetro em execução" (celular): uma notificação simples, sem botões e sem tempo; tocar nela abre o app ----
const NT_OK = () => !window.ttStore && typeof Notification !== 'undefined' && 'serviceWorker' in navigator && /^https?:/.test(location.protocol);

  if (!NT_OK() || !curUser || !auth.session) return;
  try {
    const reg = await navigator.serviceWorker.getRegistration(); if (!reg) return;

    else if (!want) cur.forEach(n => n.close());
  } catch (e) {}
}
if (typeof window !== 'undefined') {
  document.addEventListener('visibilitychange', ntSync);
  addEventListener('pageshow', ntSync);
}
if (window.ttStore) addEventListener('pagehide', () => { if (S.timer.running) timerPause(); });
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && window.TT_CLOUD) navigator.serviceWorker.register('sw.js').catch(() => {});
rollover();
authInit(); bioDetect();

setInterval(() => {
  if (today() !== curDay) { curDay = today(); rollover(); render(); return; }
